version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v4 installs cosign v3, which breaks the detached .sig/.pem signing step
      # in release.yml. Lift together with a sign-blob change.
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
