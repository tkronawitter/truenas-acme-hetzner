name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to full commit SHAs; Dependabot updates the SHA and the
# version comment together.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No job pushes, so the checkout token is not kept in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version comes from go.mod, so CI and go.mod cannot drift apart.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify
      - run: go test -v -race -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t + 0 < 70) { print "Coverage below 70%"; exit 1 } }'
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Build binary
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -buildid=" -o release/tah-linux-amd64 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tah-binaries
          path: release/tah-*

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck is pinned in tools/go.mod (a separate module, so it does not
      # raise versions in the binary's dependency graph); Dependabot bumps it.
      # It fails only on vulnerabilities the code actually reaches.
      - name: govulncheck
        run: |
          go -C tools install golang.org/x/vuln/cmd/govulncheck
          govulncheck -version
          govulncheck ./...
