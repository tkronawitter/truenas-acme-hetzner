name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to full commit SHAs; Dependabot updates the SHA and the
# version comment together.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - run: go mod download
      - run: go mod verify
      - run: go test -v -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # A reachable vulnerability stops the release before anything is built or signed.
      # Version pinned in tools/go.mod.
      - name: govulncheck
        run: |
          go -C tools install golang.org/x/vuln/cmd/govulncheck
          govulncheck -version
          govulncheck ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create the GitHub Release and upload assets
      id-token: write  # Required for OIDC/Cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      # Held at v3: cosign-installer v4 installs cosign v3, whose sign-blob ignores
      # --output-signature/--output-certificate and fails without --bundle (#9).
      # Composite action, so it is not affected by the Node.js 20 deprecation.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.5'
      - name: Build binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          # Static binary: no dependency on the runner's glibc, which would otherwise
          # set the minimum glibc the NAS needs
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.Version=$VERSION" -o release/tah-linux-amd64 .
      - name: Sign binary with Cosign
        run: |
          cosign sign-blob --yes \
            --output-signature release/tah-linux-amd64.sig \
            --output-certificate release/tah-linux-amd64.pem \
            release/tah-linux-amd64
          test -s release/tah-linux-amd64.sig
          test -s release/tah-linux-amd64.pem
      - name: Generate checksums
        run: |
          cd release
          sha256sum tah-* > checksums-sha256.txt
          sha512sum tah-* > checksums-sha512.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/tah-linux-amd64
            release/tah-linux-amd64.sig
            release/tah-linux-amd64.pem
            release/checksums-sha256.txt
            release/checksums-sha512.txt
          generate_release_notes: true
          # v1.2.0-rc1 and similar stay pre-releases, so releases/latest keeps pointing at a stable build
          prerelease: ${{ contains(github.ref_name, '-') }}
