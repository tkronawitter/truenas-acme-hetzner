name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to full commit SHAs; Dependabot updates the SHA and the
# version comment together.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - run: go mod download
      - run: go mod verify
      - run: go test -v -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # A reachable vulnerability stops the release before anything is built or signed.
      # Version pinned in tools/go.mod.
      - name: govulncheck
        run: |
          go -C tools install golang.org/x/vuln/cmd/govulncheck
          govulncheck -version
          govulncheck ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create the GitHub Release and upload assets
      id-token: write  # Required for OIDC/Cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache: the signed binary is built from freshly downloaded modules, not
      # from a cache that a CI run with third-party actions may have saved (#48).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      # No cosign-release input: the action's default cosign version is fixed by the
      # pinned SHA, so a Dependabot bump moves action and cosign together.
      # Composite action, so it is not affected by the Node.js 20 deprecation.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          # Static binary: no dependency on the runner's glibc, which would otherwise
          # set the minimum glibc the NAS needs
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.Version=$VERSION" -o release/tah-linux-amd64 .
      # Sigstore bundle: signature, certificate and transparency log proof in one
      # file, verifiable offline.
      - name: Sign binary with Cosign (Sigstore bundle)
        run: |
          cosign sign-blob --yes \
            --bundle release/tah-linux-amd64.sigstore.json \
            release/tah-linux-amd64
          test -s release/tah-linux-amd64.sigstore.json
      # A bundle that does not verify against this workflow's identity stops the
      # release before anything is published.
      - name: Verify bundle
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle release/tah-linux-amd64.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/tah-linux-amd64
      # Transition (#9): detached .sig/.pem for existing verification scripts,
      # published for one more release and dropped in the release after v1.3.0.
      # cosign v3 writes them only with the legacy format and without the signing config.
      - name: Sign binary with Cosign (detached, transition)
        run: |
          cosign sign-blob --yes \
            --use-signing-config=false \
            --new-bundle-format=false \
            --output-signature release/tah-linux-amd64.sig \
            --output-certificate release/tah-linux-amd64.pem \
            release/tah-linux-amd64
          test -s release/tah-linux-amd64.sig
          test -s release/tah-linux-amd64.pem
      - name: Generate checksums
        run: |
          cd release
          sha256sum tah-* > checksums-sha256.txt
          sha512sum tah-* > checksums-sha512.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/tah-linux-amd64
            release/tah-linux-amd64.sigstore.json
            release/tah-linux-amd64.sig
            release/tah-linux-amd64.pem
            release/checksums-sha256.txt
            release/checksums-sha512.txt
          generate_release_notes: true
          # v1.2.0-rc1 and similar stay pre-releases, so releases/latest keeps pointing at a stable build
          prerelease: ${{ contains(github.ref_name, '-') }}
